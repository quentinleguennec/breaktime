name: aebeze
description: AeBeZe Labs set of applications for mental health.
version: 2.3.0+173

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^5.0.1
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^0.1.2
  intl: ^0.15.7
  http: ^0.12.0+1
  shared_preferences: ^0.5.1+1
  firebase_analytics: ^5.0.6
  firebase_auth: ^0.14.0+8
  firebase_core: ^0.4.1+3
  firebase_crashlytics: ^0.1.1+2
  firebase_messaging: 5.1.8
  cloud_firestore: ^0.12.10
  #  video_player: ^0.10.1+6 # breaks the audio card on iOS. 0.10.0+7 doesn't exists, but the following should act the same.
  video_player:
    git:
      url: https://github.com/flutter/plugins.git
      path: packages/video_player
      ref: 31038b93e05780091a03288abeb643a0bf342258
  screen: ^0.0.4
  uni_links: ^0.1.4
  launch_review: 2.0.0
  package_info: ^0.4.0+1
  slide_container: ^1.1.3
  flutter_cache_manager: ^1.1.3
  flutter_local_notifications: ^1.2.1
  event_bus: ^1.0.3
  arrow_path: ^1.0.0
  date_utils: ^0.1.0+2
  rxdart: 0.21.0
  audioplayers: 0.15.1
  marquee: 1.3.1
  share:
    git:
      url: https://github.com/tengio/plugins.git
      path: packages/share
  flutter_facebook_login:
    git:
      url: https://github.com/Tengio/flutter_facebook_login

dependency_overrides:
  intl: ^0.16.0

dev_dependencies:
  #  flutter_test:
  #    sdk: flutter
  flutter_launcher_icons: ^0.7.2

# Used to generate icons
# flutter_icons:
#   android: false
#   ios: false
#   image_path: "res/images/aebeze_icon.png"
#  adaptive_icon_background: "#FFFFFFFF"
#  adaptive_icon_foreground: "res/images/web_hi_res_512.png"

flutter:
  assets:
    - res/images/
    - res/videos/
    - res/json/
  uses-material-design: true
  fonts:
    - family: BeatriceDisplaySemiBold
      fonts:
        - asset: res/fonts/BeatriceDisplayDA-Semibold.otf

    - family: PatronRegular
      fonts:
        - asset: res/fonts/PatronAPP-Regular.otf

    - family: PatronLight
      fonts:
        - asset: res/fonts/PatronAPP-Light.otf

    - family: ZirkonRegular
      fonts:
        - asset: res/fonts/Zirkon-Regular.otf

    - family: ZirkonMedium
      fonts:
        - asset: res/fonts/Zirkon-Medium.otf

    - family: ZirkonBook
      fonts:
        - asset: res/fonts/Zirkon-Book.otf

    - family: ProtoGroteskLight
      fonts:
        - asset: res/fonts/ProtoGrotesk-Light.otf

    - family: ProtoGroteskRegular
      fonts:
        - asset: res/fonts/ProtoGrotesk-Regular.otf

    - family: GTSectraMedium
      fonts:
        - asset: res/fonts/GT-Sectra-Display-Medium.otf

    - family: GTSectraDisplayBold
      fonts:
        - asset: res/fonts/GT-Sectra-Display-Bold.otf
